name: 功能请求
description: 提出可讨论、可评估的改进建议。
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请勿粘贴密码、访问令牌、个人联系方式、内部任务数据、成员信息或未公开文件。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述谁在什么场景下遇到了什么困难；请使用不含私密信息的例子。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 说明期望的行为、边界和成功标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
      description: 说明现有办法为什么不足，或是否有其他可行方案。
