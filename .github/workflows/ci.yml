name: CI

on:
  pull_request:
    branches: [main, 'codex/review-20261025-*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax, lint and migration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Checkout exact main commit before PR changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-main-baseline
          persist-credentials: false
      - name: Test migration from main commit with populated SQLite data
        env:
          XTYF_UPGRADE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tests/upgrade_from_main.py
      - name: Python syntax check
        run: python -m compileall -q app.py common.py modules tests deploy
      - name: 'Lint (ruff: syntax, unused imports/variables)'
        run: ruff check app.py common.py modules deploy tests

  python:
    name: Python tests (${{ matrix.os }} / ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [tasks, members, finance, assets, collaboration, platform]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run module tests with branch coverage
        run: coverage run --branch --parallel-mode --source=app,common,modules,deploy tests/ci_shards.py ${{ matrix.shard }}
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true

  python-coverage:
    name: Python combined branch coverage (${{ matrix.os }})
    needs: python
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install coverage
        run: python -m pip install coverage==7.16.2
      - name: Download module coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-data-${{ matrix.os }}-*
          merge-multiple: true
      - name: Combine coverage and enforce the original 65% threshold
        shell: bash
        run: |
          set -euo pipefail
          coverage combine
          coverage report -m
          coverage xml -o coverage.xml
          coverage json -o coverage.json
          python -c 'import json,os; p=json.load(open("coverage.json"))["totals"]["percent_covered_display"]; open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Python branch coverage (combined shards)\n\nTotal: **"+p+"%**\n")'
          coverage report --fail-under=65
      - name: Upload combined coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: warn
          include-hidden-files: true

  javascript:
    name: JavaScript unit + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run browser logic unit tests
        run: node --test tests/js/*.test.cjs

  browser-image-smoke:
    name: Build and smoke browser image (no registry writes)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f .github/ci/browser.Dockerfile -t xtyf-browser-smoke .
      - name: Launch both browser engines in the built image
        run: |
          docker run --rm --ipc=host xtyf-browser-smoke node -e '(async()=>{const p=require("playwright");for(const name of ["chromium","webkit"]){const b=await p[name].launch({headless:true});const page=await b.newPage();await page.setContent("<title>smoke</title>");if(await page.title()!=="smoke")throw Error(name);await b.close();}})().catch(e=>{console.error(e);process.exit(1)})'

  browser-image:
    name: Prepare reusable browser container (GHCR)
    # Never publish untrusted code from forks; they use the vendor image fallback.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve CI image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(sha256sum .github/ci/browser.Dockerfile requirements.txt requirements-dev.txt | sha256sum | cut -c1-16)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-ci-browser:ci-${TAG}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "CI image: $IMAGE"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check existing published image
        id: existing
        shell: bash
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" > /dev/null 2>&1; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo "Reusing prebuilt CI image"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "Image missing, one build is needed"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.present != 'true'
      - name: Build and publish the missing image
        if: steps.existing.outputs.present != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/browser.Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=xtyf-browser-ci
          cache-to: type=gha,mode=max,scope=xtyf-browser-ci

  browser:
    name: Browser end-to-end (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundation-core
            suites: 'review_fixes pr22_merge'
          - group: foundation-login
            suites: 'action_failures login_mobile'
          - group: tasks-core
            suites: 'task_center task_schedule'
          - group: tasks-mail
            suites: 'daily_mail task_profiles'
          - group: tasks-repairs
            suites: 'seven_repairs seven_repairs_review'
          - group: ui-core
            suites: 'palette_workspace local_collaboration account_avatar ui_regressions funds_recovery'
          - group: ui-clients
            suites: 'account_invoice_ui client_updates_avatar client_connection invoice_polling camera_origin_probe'
          - group: assets-ledger
            suites: 'assets'
          - group: assets-serialized
            suites: 'assets_serialized'
          - group: assets-intake
            suites: 'assets_intake assets_catalog_paging'
    needs: browser-image
    # A missing image for a fork should not prevent the read-only fallback path.
    if: ${{ always() && (needs.browser-image.result == 'success' || needs.browser-image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.browser-image.outputs.image || 'mcr.microsoft.com/playwright:v1.57.0-noble' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use preinstalled browser and Python dependencies
        if: needs.browser-image.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ln -s /opt/xtyf-node/node_modules node_modules
          python --version
          node --version
          node -e "require('playwright')"
      - uses: actions/setup-python@v5
        if: needs.browser-image.result == 'skipped'
        with:
          python-version: '3.13'
          # The vendor Playwright image lacks lsb_release, which setup-python's
          # Linux pip-cache key requires. Install normally on the fork fallback;
          # native Python jobs retain caching and the GHCR path is preinstalled.
      - uses: actions/setup-node@v4
        if: needs.browser-image.result == 'skipped'
        with:
          node-version: '22'
      - name: Fallback project dependencies for external PRs
        if: needs.browser-image.result == 'skipped'
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --no-save --package-lock=false playwright@1.57.0 bootstrap@5.3.3 bootstrap-icons@1.11.3
      - name: Prepare verified public browser resources
        # Every matrix group starts from a fresh checkout. PDF previews must not
        # depend on an earlier suite incidentally building the client frontend.
        run: python -c "from clients.frontend.vendor_dependencies import ensure_vendor_assets; ensure_vendor_assets()"
      - name: Run browser integration and mobile checks
        shell: bash
        env:
          REVIEW_PYTHON: python
          SUITES: ${{ matrix.suites }}
        run: |
          set -euo pipefail
          failures=0
          for suite in $SUITES; do
            echo "::group::Browser test: ${suite}"
            if ! node "tests/browser/${suite}.cjs"; then
              echo "::error::Browser suite ${suite} failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          exit "$((failures > 0))"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics-${{ matrix.group }}
          path: |
            .venv/*-check/*.png
            .venv/*-check/*.json
            .build-tools/*-check/*.png
            .build-tools/*-check/*.json
            .build-tools/seven-repairs-20261018/browser/*.png
            .build-tools/seven-repairs-20261018/browser/*.json
            .build-tools/assets-review-fixes/*.png
            .build-tools/assets-review-fixes/*.json
          include-hidden-files: true
          if-no-files-found: ignore
