name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit + API regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Checkout exact main commit before PR changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-main-baseline
          persist-credentials: false
      - name: Test migration from main commit with populated SQLite data
        env:
          XTYF_UPGRADE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tests/upgrade_from_main.py
      - name: Python syntax check
        run: python -m compileall -q app.py common.py modules tests deploy
      - name: Run unit and integration tests with branch coverage
        run: coverage run --branch --source=app,common,modules,deploy -m unittest discover -s tests -v
      - name: Coverage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # The gate must never be skippable: a missing .coverage is a failure.
          coverage report -m
          coverage xml -o coverage.xml
          coverage json -o coverage.json
          python -c 'import json,os; p=json.load(open("coverage.json"))["totals"]["percent_covered_display"]; open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Python branch coverage\n\nTotal: **"+p+"%**\n")'
          coverage report --fail-under=65
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
          include-hidden-files: true

  javascript:
    name: JavaScript unit + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run browser logic unit tests
        run: node --test tests/js/*.test.cjs
  
  browser:
    name: Browser end-to-end (Chromium + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Run browser integration and mobile checks
        shell: bash
        env:
          REVIEW_PYTHON: python
        run: |
          set -euo pipefail
          failures=0
          for suite in review_fixes pr22_merge task_center daily_mail action_failures login_mobile palette_workspace local_collaboration account_invoice_ui task_schedule; do
            echo "::group::Browser test: ${suite}"
            if ! node "tests/browser/${suite}.cjs"; then
              echo "::error::Browser suite ${suite} failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          exit "$((failures > 0))"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          path: |
            .venv/login-password-check/*.png
            .venv/login-password-check/mobile-result.json
            .venv/pr22-merge-check/*.png
            .venv/pr22-merge-check/browser-result.json
            .venv/task-center-check/*.png
            .venv/task-center-check/result.json
            .venv/daily-mail-check/*.png
            .venv/daily-mail-check/result.json
            .venv/action-failure-check/result.json
            .venv/palette-workspace-check/*.png
            .venv/palette-workspace-check/result.json
            .venv/local-collaboration-check/*.png
            .venv/local-collaboration-check/result.json
          include-hidden-files: true
          if-no-files-found: warn

