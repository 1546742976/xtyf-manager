name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python syntax, lint and migration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Checkout exact main commit before PR changes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-main-baseline
          persist-credentials: false
      - name: Test migration from main commit with populated SQLite data
        env:
          XTYF_UPGRADE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tests/upgrade_from_main.py
      - name: Python syntax check
        run: python -m compileall -q app.py common.py modules tests deploy
      - name: 'Lint (ruff: syntax, unused imports/variables)'
        run: ruff check app.py common.py modules deploy tests

  python:
    name: Python tests (${{ matrix.os }} / ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [tasks, members, finance, assets, collaboration, platform]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run module tests with branch coverage
        run: coverage run --branch --parallel-mode --source=app,common,modules,deploy tests/ci_shards.py ${{ matrix.shard }}
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-data-${{ matrix.os }}-${{ matrix.shard }}
          path: .coverage.*
          if-no-files-found: error
          include-hidden-files: true

  python-coverage:
    name: Python combined branch coverage (${{ matrix.os }})
    needs: python
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install coverage
        run: python -m pip install 'coverage>=7.6,<8'
      - name: Download module coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-data-${{ matrix.os }}-*
          merge-multiple: true
      - name: Combine coverage and enforce the original 65% threshold
        shell: bash
        run: |
          set -euo pipefail
          coverage combine
          coverage report -m
          coverage xml -o coverage.xml
          coverage json -o coverage.json
          python -c 'import json,os; p=json.load(open("coverage.json"))["totals"]["percent_covered_display"]; open(os.environ["GITHUB_STEP_SUMMARY"],"a").write("## Python branch coverage (combined shards)\n\nTotal: **"+p+"%**\n")'
          coverage report --fail-under=65
      - name: Upload combined coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: warn
          include-hidden-files: true

  javascript:
    name: JavaScript unit + syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          for file in static/*.js; do node --check "$file"; done
      - name: Run browser logic unit tests
        run: node --test tests/js/*.test.cjs

  browser:
    name: Browser end-to-end (${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: foundation
            suites: 'review_fixes pr22_merge action_failures login_mobile'
          - group: tasks
            suites: 'task_center task_schedule daily_mail seven_repairs seven_repairs_review'
          - group: ui-and-clients
            suites: 'palette_workspace local_collaboration account_avatar account_invoice_ui client_updates_avatar client_connection'
          - group: assets
            suites: 'assets assets_serialized'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright and browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 bootstrap@5.3.3 bootstrap-icons@1.11.3
          npx playwright install --with-deps chromium webkit
      - name: Run browser integration and mobile checks
        shell: bash
        env:
          REVIEW_PYTHON: python
          SUITES: ${{ matrix.suites }}
        run: |
          set -euo pipefail
          failures=0
          for suite in $SUITES; do
            echo "::group::Browser test: ${suite}"
            if ! node "tests/browser/${suite}.cjs"; then
              echo "::error::Browser suite ${suite} failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          exit "$((failures > 0))"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics-${{ matrix.group }}
          path: |
            .venv/*-check/*.png
            .venv/*-check/*.json
            .build-tools/*-check/*.png
            .build-tools/*-check/*.json
            .build-tools/seven-repairs-20261018/browser/*.png
            .build-tools/seven-repairs-20261018/browser/*.json
          include-hidden-files: true
          if-no-files-found: ignore
