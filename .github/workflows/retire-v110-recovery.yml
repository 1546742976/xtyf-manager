name: Retire one-time v1.1.0 recovery

# Adding this file once cancels a duplicate in-flight recovery build.
# The published release is already verified and must not be overwritten.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-v110-recovery.yml'

permissions:
  contents: read

concurrency:
  group: stable-release-v1.1.0
  cancel-in-progress: true

jobs:
  verify:
    name: Verify v1.1.0 release and stop redundant recovery
    runs-on: ubuntu-latest
    steps:
      - name: Confirm nine final Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')"
          if [[ "$count" != "9" ]]; then
            echo "::error::v1.1.0 Release must have nine verified assets; found $count"
            exit 1
          fi
          echo "Verified published v1.1.0 has all nine assets. Retiring redundant recovery runs."
