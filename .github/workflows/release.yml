name: Client release

on:
  push:
    branches: [main]
    paths:
      - 'clients/**'
      - '!clients/**/*.md'
      - 'templates/*.html'
      - 'static/**'
      - '.github/release-intent.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Publishing is serial across new commits, so the next Beta tag is never claimed twice.
concurrency:
  group: xtyf-client-publish-main
  cancel-in-progress: false

jobs:
  resolve:
    name: Select immutable release identity
    # Manual dispatch must never execute signed release code from an unreviewed branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{steps.version.outputs.version}}
      tag: ${{steps.version.outputs.tag}}
      channel: ${{steps.version.outputs.channel}}
      code: ${{steps.version.outputs.code}}
      already_published: ${{steps.version.outputs.already_published}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.sha}}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Allocate Beta or approve release-PR stable version
        id: version
        env:
          GH_TOKEN: ${{github.token}}
        run: python clients/versioning_ci.py select --output "$GITHUB_OUTPUT"

  build:
    name: Test and build signed client packages
    needs: resolve
    if: needs.resolve.outputs.already_published != 'true'
    uses: ./.github/workflows/clients.yml
    with:
      source_ref: ${{github.sha}}
      release_version: ${{needs.resolve.outputs.version}}
      android_version_code: ${{needs.resolve.outputs.code}}
      signed_android: true
    secrets: inherit
    permissions:
      contents: read

  publish:
    name: Verify and upload Release
    needs: [resolve, build]
    if: needs.resolve.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{github.token}}
      RELEASE_VERSION: ${{needs.resolve.outputs.version}}
      RELEASE_CODE: ${{needs.resolve.outputs.code}}
      RELEASE_TAG: ${{needs.resolve.outputs.tag}}
      RELEASE_CHANNEL: ${{needs.resolve.outputs.channel}}
      SOURCE_SHA: ${{github.sha}}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{github.sha}}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reproduce version metadata for checksum collector
        env:
          XTYF_VERSION: ${{needs.resolve.outputs.version}}
          XTYF_CODE: ${{needs.resolve.outputs.code}}
        run: python clients/versioning_ci.py apply
      - uses: actions/download-artifact@v4
        with:
          pattern: xtyf-client-*
          path: dist/github-artifacts
          merge-multiple: false
      - name: Validate all seven packages, manifest and digests
        run: python clients/collect_release_assets.py --artifacts-dir dist/github-artifacts --output-dir dist/release-assets --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL"
      - name: Refuse tag retargeting or replacing existing Release assets
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git ls-remote --tags --refs origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')
          if [[ -n "$existing" ]]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            resolved=$(git rev-parse "$RELEASE_TAG^{commit}")
            if [[ "$resolved" != "$SOURCE_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG belongs to another commit"; exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,isImmutable,assets > "$RUNNER_TEMP/old-release.json" 2>"$RUNNER_TEMP/release-error"; then
            jq -e --arg tag "$RELEASE_TAG" --arg channel "$RELEASE_CHANNEL" \
              '.tagName == $tag and .isDraft == false and .isImmutable == false and (.assets | length) == 0 and (.isPrerelease == ($channel == "prerelease"))' \
              "$RUNNER_TEMP/old-release.json" >/dev/null || {
                echo "::error::Existing release metadata or assets do not permit upload"; exit 1;
              }
            echo "existing=true" >> "$GITHUB_ENV"
          elif grep -qiE 'release not found|HTTP 404' "$RUNNER_TEMP/release-error"; then
            echo "existing=false" >> "$GITHUB_ENV"
          else
            cat "$RUNNER_TEMP/release-error" >&2; exit 1
          fi
      - name: Publish exactly verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release-assets/*)
          if (( ${#files[@]} != 9 )); then
            echo "::error::Expected seven installers plus two verification files"; exit 1
          fi
          if [[ "$existing" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          else
            args=(--repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "XTYF Manager $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_CHANNEL" == "prerelease" ]]; then
              args+=(--prerelease --latest=false)
            else
              args+=(--latest)
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" "${args[@]}"
          fi
          count=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          [[ "$count" == 9 ]] || { echo "::error::Release has $count files, expected 9"; exit 1; }
