name: Recover v1.1.0 by building from its exact source

# One-time recovery of the user-deleted v1.1.0 tag and stable Release.
# GITHUB_TOKEN cannot create a tag pointing to the old workflow-changing
# commit; creating a new consistent source tag on current main is permitted.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-v110.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release-v1.1.0
  cancel-in-progress: false

jobs:
  prepare:
    name: Establish correct v1.1.0 tag and application version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve or create the version tag on matching current source
        shell: bash
        id: source
        run: |
          set -euo pipefail
          if git show-ref --quiet --verify refs/tags/v1.1.0; then
            source="$(git rev-parse refs/tags/v1.1.0^{commit})"
          else
            source="$(git rev-parse HEAD)"
            git tag v1.1.0 "$source"
            git push origin refs/tags/v1.1.0
          fi
          git merge-base --is-ancestor "$source" refs/remotes/origin/main
          git show "$source:clients/config.json" > "$RUNNER_TEMP/version.json"
          python - "$RUNNER_TEMP/version.json" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1], encoding="utf-8"))
          if config["version"] != "1.1.0" or int(config["versionCode"]) < 1:
              raise SystemExit("v1.1.0 tag must point to source version 1.1.0")
          PY
          echo "sha=$source" >> "$GITHUB_OUTPUT"
          echo "Valid release source: $source"

  build:
    name: Test and build installers matching the new v1.1.0 tag
    needs: prepare
    uses: ./.github/workflows/clients.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
    permissions:
      contents: write

  publish:
    name: Upload seven signed/verified installers as v1.1.0
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.1.0
    steps:
      - name: Checkout the exact tagged build source and verification code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve packages built in this same run
        uses: actions/download-artifact@v4
        with:
          pattern: xtyf-client-*
          path: dist/github-artifacts
          merge-multiple: false
      - name: Verify artifact completeness and checksums
        run: |
          python clients/collect_release_assets.py \
            --artifacts-dir dist/github-artifacts \
            --output-dir dist/release-assets \
            --tag "$RELEASE_TAG" --channel stable
      - name: Publish packages without updating Release metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release-assets/*)
          if (( ${#files[@]} != 9 )); then
            echo "::error::Need seven installers, SHA256SUMS.txt, and build-report.json"
            exit 1
          fi
          state="$RUNNER_TEMP/stable-release.json"
          err="$RUNNER_TEMP/stable-release-error.txt"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
             --json tagName,isDraft,isPrerelease,isImmutable,assets > "$state" 2> "$err"; then
            python clients/release_target.py --tag "$RELEASE_TAG" --metadata "$state"
            gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          elif grep -qiE 'release not found|HTTP 404' "$err"; then
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "XTYF Manager v1.1.0" --generate-notes --latest
          else
            cat "$err" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets --jq '.assets | length' | grep -qx '9' || {
            echo "::error::Incomplete Release attachments"
            exit 1
          }
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
