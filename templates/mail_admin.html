{% extends "base.html" %}
{% block title %}邮件提醒管理{% endblock %}
{% block content %}
<div id="mail-admin"><h1>邮件提醒管理</h1><p>每天 09:00 汇总个人任务。“SMTP 已接受”仅表示邮件服务器接受，不表示已进入收件箱。</p>
<div class="daily-actions"><button type="button" class="btn" id="mail-refresh">刷新</button><button type="button" class="btn" id="mail-test">向本人发送测试邮件</button></div><p id="mail-result" role="status" aria-live="polite"></p>
<section class="panel"><h2>成员邮箱与提醒状态</h2><div id="mail-members" class="daily-grid"></div></section>
<section class="panel"><h2>发送记录</h2><div id="mail-jobs"></div><div class="daily-actions"><button class="btn" type="button" id="mail-prev">上一页</button><span id="mail-page"></span><button class="btn" type="button" id="mail-next">下一页</button></div></section></div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static',filename='email.js') }}"></script>{% endblock %}
