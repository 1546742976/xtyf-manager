{# 看板页：统计卡 + 筛选栏 + 卡片墙；渲染与轮询逻辑在 static/app.js #}
{% extends "base.html" %}
{% block title %}看板{% endblock %}
{% block content %}
<div class="page-intro ux-page-head">
  <div><p class="ux-eyebrow">OPERATIONS / OVERVIEW</p><h1>任务总览</h1><p>以负责人和状态为线索，快速定位风险与下一步工作。</p></div>
  <div class="sync-tools"><span id="sync-status" class="sync-status" role="status" aria-live="polite">正在同步…</span>
    <button id="refresh-now" class="btn" type="button">立即刷新</button></div>
</div>
<section class="stats" id="stats" aria-label="任务统计"></section>
<section class="toolbar">
  <div class="seg" id="view-seg">
    <button type="button" data-view="person" class="active">按人</button>
    <button type="button" data-view="status">按状态</button>
  </div>
  <select id="f-group"><option value="">全部组别</option></select>
  <select id="f-status"><option value="">全部状态</option></select>
  <input id="f-q" type="search" aria-label="搜索任务" placeholder="搜索任务 / 负责人 / 项目">
  <label class="check"><input type="checkbox" id="f-mine"> 只看我的</label>
  <span class="hint">自动同步 · 5 秒</span>
</section>
<section id="board" class="board"></section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
