{% if pwa_enabled %}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="巡天御风">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='pwa/apple-touch-icon.png', v=pwa_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='pwa.css', v=pwa_version) }}">
<script src="{{ url_for('static', filename='pwa.js', v=pwa_version) }}" defer></script>
{% endif %}
