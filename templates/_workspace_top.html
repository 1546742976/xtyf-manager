  <div class="ws-breadcrumb"><a href="{{ url_for('index') }}">工作空间</a><span class="ws-breadcrumb-sep">/</span><strong>{% if page == 'dashboard' %}工作台{% elif page == 'tasks' %}任务中心{% elif page == 'manage' %}任务管理{% elif page == 'members' %}成员管理{% elif page == 'funds' %}资金台账{% elif page == 'invoices' %}发票中心{% elif page == 'discussions' %}讨论与建议{% else %}账户设置{% endif %}</strong></div>
