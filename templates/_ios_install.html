<details class="ios-install ux-note" data-ios-install hidden>
  <summary>在 iPhone 上添加到主屏幕</summary>
  <ol>
    <li>用 Safari 打开本网站。</li>
    <li>打开分享菜单，选择“添加到主屏幕”；找不到时可在“编辑操作”中添加。</li>
    <li>如果出现“作为网页 App 打开”，请保持开启，再点“添加”。</li>
  </ol>
  <p>以后可从主屏幕的“巡天御风”图标进入。首次进入可能需要重新登录。使用时需要联网，重新打开页面可获取网站更新；正在填写内容时不会自动刷新。</p>
</details>
