{# 登录页：品牌标题 + 登录表单（fetch 提交 JSON 到 /login） #}
{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="login-mark" aria-hidden="true">巡</div>
    <p class="ux-eyebrow">TEAM WORKSPACE</p>
    <h1>巡天御风管理平台</h1>
    <p class="sub">南京航空航天大学 · 巡天御风机甲战队</p>
    <label>用户名
      <input name="username" autocomplete="username" required autofocus placeholder="请输入用户名">
    </label>
    <label>密码
      <input name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
    </label>
    <button class="btn primary block" type="submit">登录</button>
    <p class="error hidden" id="login-error"></p>
    <p class="login-footer">巡天御风 · 团队工作空间</p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  const button = event.target.querySelector('button[type="submit"]');
  button.disabled = true;
  let res;
  try {
    res = await fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: form.get('username'), password: form.get('password') }),
    });
  } catch (_) {
    const el = document.getElementById('login-error');
    el.textContent = '网络连接失败，请重试';
    el.classList.remove('hidden');
    button.disabled = false;
    return;
  }
  button.disabled = false;
  const data = await res.json().catch(() => ({ ok: false, error: '服务端响应异常' }));
  if (data.ok) {
    location.href = data.redirect || '/';
  } else {
    const el = document.getElementById('login-error');
    el.textContent = data.error || '登录失败';
    el.classList.remove('hidden');
  }
});
</script>
{% endblock %}
