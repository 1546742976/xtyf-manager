{# 登录页：品牌标题 + 登录表单（fetch 提交 JSON 到 /login） #}
{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="login-wrap">
  <form id="login-form" class="login-card">
    <div class="login-mark" aria-hidden="true">巡</div>
    <p class="ux-eyebrow">TEAM WORKSPACE</p>
    <h1>巡天御风管理平台</h1>
    <p class="sub">南京航空航天大学 · 巡天御风机甲战队</p>
    <label>用户名
      <input name="username" autocomplete="username" required autofocus placeholder="请输入用户名">
    </label>
    <div class="login-password-field">
      <label for="login-password">密码</label>
      <div class="login-password-control">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="请输入密码">
        <button class="login-password-toggle" type="button" aria-label="显示密码" title="显示密码" aria-controls="login-password">
          <svg class="password-show-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="password-hide-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="m3 3 18 18M10.6 5.1A12 12 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3 3.8M6.2 6.2A21 21 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.8-1.8M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
      </div>
    </div>
    <button class="btn primary block" type="submit">登录</button>
    <p class="error hidden" id="login-error"></p>
    <p class="login-footer">巡天御风 · 团队工作空间</p>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const passwordInput = document.getElementById('login-password');
const passwordToggle = document.querySelector('.login-password-toggle');
passwordToggle.addEventListener('click', () => {
  const visible = passwordInput.type === 'password';
  passwordInput.type = visible ? 'text' : 'password';
  const label = visible ? '隐藏密码' : '显示密码';
  passwordToggle.setAttribute('aria-label', label);
  passwordToggle.title = label;
  passwordToggle.querySelector('.password-show-icon').toggleAttribute('hidden', visible);
  passwordToggle.querySelector('.password-hide-icon').toggleAttribute('hidden', !visible);
});
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (event.target.querySelector('button[type="submit"]').disabled) return;
  const form = new FormData(event.target);
  const button = event.target.querySelector('button[type="submit"]');
  button.disabled = true;
  let res;
  try {
    res = await BusinessUI.fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: form.get('username'), password: form.get('password') }),
    });
  } catch (error) {
    const el = document.getElementById('login-error');
    el.textContent = error.message || '网络连接失败，请重试';
    el.classList.remove('hidden');
    button.disabled = false;
    return;
  }
  button.disabled = false;
  const data = await res.json().catch(() => ({ ok: false, error: '服务端响应异常' }));
  if (data.ok) {
    location.href = data.redirect || '/';
  } else {
    const el = document.getElementById('login-error');
    el.textContent = data.error || '登录失败';
    el.classList.remove('hidden');
  }
});
</script>
{% endblock %}
