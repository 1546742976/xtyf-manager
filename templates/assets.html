{% extends "base.html" %}
{% block title %}资产管理{% endblock %}
{% block content %}
<section class="asset-workspace" aria-labelledby="asset-title">
  <header class="asset-heading">
    <div><p class="asset-eyebrow">团队资源 / INVENTORY</p><h1 id="asset-title">资产管理</h1><p class="asset-muted">按型号统计，按校区存放。每一次借还与领用都有记录。</p></div>
    <button class="btn" id="asset-refresh" type="button">刷新数据</button>
  </header>
  <nav class="asset-tabs" aria-label="资产导航">
    <a class="btn" href="/assets">全部物品</a><a class="btn" href="/assets?view=mine">我的借用</a>
    <button class="btn" id="asset-scan" type="button">扫码登记</button>
    <button class="btn" id="asset-unit-mine" type="button">我的单件／待接收</button>
    <button class="btn" id="asset-campuses" type="button" hidden>校区管理</button>
    <button class="btn" id="asset-categories" type="button" hidden>类别管理</button>
    <button class="btn primary" id="asset-create" type="button" hidden>新增物品</button>
  </nav>
  <p id="asset-status" role="status" aria-live="polite" tabindex="-1"></p>
  <div id="asset-pending" class="asset-pending" role="alert" hidden>
    <span id="asset-pending-message"></span>
    <button class="btn" id="asset-pending-retry" type="button">重试上次提交</button>
  </div>
  <form id="asset-filter" class="asset-filters">
    <label>名称或规格<input name="q" type="search" maxlength="120" placeholder="例如：M3 螺丝、3508 电机"></label>
    <label>校区<select name="campus_id"><option value="">全部校区</option></select></label>
    <label>类别<select name="category"><option value="">全部类别</option></select></label>
    <button class="btn" type="submit">筛选</button>
  </form>
  <div id="asset-content" aria-busy="true"></div>
</section>
<dialog id="asset-dialog" aria-labelledby="asset-dialog-title" class="asset-dialog">
  <form id="asset-form">
    <header class="asset-heading"><h2 id="asset-dialog-title">资产操作</h2><button class="btn" type="button" id="asset-close">取消</button></header>
    <div id="asset-fields" class="asset-fields"></div>
    <p id="asset-form-status" role="alert" tabindex="-1"></p>
    <footer><button class="btn primary" id="asset-save" type="submit">确认保存</button></footer>
  </form>
</dialog>
<dialog id="asset-unit-drawer" class="asset-dialog asset-unit-drawer" aria-labelledby="asset-unit-title">
  <header class="asset-heading"><h2 id="asset-unit-title">单件管理</h2><button class="btn" id="asset-unit-close" type="button">关闭</button></header>
  <label>实物校区<select id="asset-unit-campus"><option value="">全部校区</option></select></label>
  <p id="asset-unit-status" role="status"></p><p id="asset-unit-selected" aria-live="polite"></p>
  <div id="asset-unit-actions" class="asset-actions"></div><div id="asset-unit-content"></div><div id="asset-unit-history"></div>
</dialog>
<dialog id="asset-scan-dialog" class="asset-dialog" aria-labelledby="asset-scan-title">
  <header class="asset-heading"><h2 id="asset-scan-title">扫码工作台</h2><button type="button" class="btn" id="asset-scan-close">关闭</button></header>
  <form id="asset-scan-form" class="asset-fields"><label>标签原文或商品编号<textarea id="asset-scan-raw" rows="3" maxlength="4096" required></textarea></label><button class="btn" type="submit">识别</button></form>
  <div id="asset-scan-camera"></div><p id="asset-scan-status" role="status"></p><div id="asset-scan-preview"></div>
</dialog>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='assets.js') }}"></script><script src="{{ url_for('static', filename='asset-units.js') }}"></script><script src="{{ url_for('static', filename='asset-scan.js') }}"></script>{% endblock %}
