[package]
name = "xtyf-manager"
version = "1.0.9"
edition = "2021"
description = "巡天御风管理系统本地客户端"
authors = ["巡天御风 <1546742976@qq.com>"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "multipart", "stream", "json"] }
reqwest_cookie_store = "0.8"
rfd = "0.15"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = "0.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

