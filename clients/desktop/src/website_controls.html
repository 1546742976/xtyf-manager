<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网站工具栏</title>
<style>
html{font:14px system-ui,sans-serif;color-scheme:light dark}
body{margin:0;background:Canvas;color:CanvasText}
button{font:inherit;padding:5px 9px;cursor:pointer;white-space:nowrap;min-height:34px}
button:focus-visible{outline:2px solid Highlight;outline-offset:-3px}
#menu-toggle{width:68px;height:40px;border:1px solid GrayText;border-radius:6px;background:Canvas;color:CanvasText}
body.expanded{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) 16px;gap:4px 8px;padding:4px 10px;box-sizing:border-box;height:80px}
body.expanded #menu-toggle{height:34px;align-self:center}
nav{display:flex;gap:6px;align-items:center;overflow-x:auto}
[hidden]{display:none!important}
#status{grid-column:1/-1;font-size:12px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<button id="menu-toggle" type="button" aria-label="打开客户端菜单" aria-expanded="false" aria-controls="website-navigation" title="打开客户端菜单">菜单</button>
<nav id="website-navigation" aria-label="网站导航" hidden><button data-action="website_back">后退</button><button data-action="website_home">首页</button><button data-action="website_reload">重载</button><button data-intent="return">本地界面</button><button data-intent="settings">设置</button><button data-intent="retry">重试本地</button></nav><div id="status" role="status" hidden>网站模式 · 登录与文件操作由网站处理</div>
<script>
const toggle=document.getElementById('menu-toggle'),navigation=document.getElementById('website-navigation'),status=document.getElementById('status');
async function setExpanded(expanded){
  if(toggle.disabled)return;
  toggle.disabled=true;
  try{
    const result=await window.__TAURI_INTERNALS__.invoke('native_call',{action:'website_menu',args:{expanded}});
    document.body.classList.toggle('expanded',result.expanded);
    navigation.hidden=status.hidden=!result.expanded;
    toggle.setAttribute('aria-expanded',String(result.expanded));
    toggle.setAttribute('aria-label',result.expanded?'收起客户端菜单':'打开客户端菜单');
    toggle.title=result.expanded?'收起客户端菜单（Esc）':'打开客户端菜单';
    toggle.textContent=result.expanded?'收起':'菜单';
  }catch(error){status.textContent=String(error);toggle.title=String(error);}
  finally{toggle.disabled=false;toggle.focus();}
}
toggle.addEventListener('click',()=>setExpanded(toggle.getAttribute('aria-expanded')!=='true'));
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&toggle.getAttribute('aria-expanded')==='true'){event.preventDefault();setExpanded(false);}
});
document.querySelector('nav').addEventListener('click',async event=>{
  const button=event.target.closest('button');if(!button)return;
  const intent=button.dataset.intent,action=intent?'return_local':button.dataset.action;
  if(action!=='website_back'&&!confirm('继续可能丢失网站中未保存的内容，是否继续？'))return;
  button.disabled=true;
  try{await window.__TAURI_INTERNALS__.invoke('native_call',{action,args:intent?{intent}:{}});}
  catch(error){document.getElementById('status').textContent=String(error);}
  finally{button.disabled=false;}
});
</script></html>
