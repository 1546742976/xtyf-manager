<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网页浏览</title><style>body{margin:0;padding:5px 10px;display:flex;gap:10px;background:#f5f5f7;font-family:system-ui}button{height:38px;min-width:70px;border:1px solid #aaa;border-radius:7px;background:white;cursor:pointer}span{flex:1;align-self:center;font-size:14px;color:#555}</style></head><body><button id="back" type="button">返回</button><span>应用内网页</span><button id="close" type="button">关闭</button><script>for(const name of ['back','close'])document.getElementById(name).onclick=()=>window.__TAURI_INTERNALS__.invoke('native_call',{action:'external_'+name,args:{}});</script></body></html>
