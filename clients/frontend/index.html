<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>巡天御风管理系统</title><link rel="stylesheet" href="/shell.css"><script src="/bridge.js"></script><script src="/templates.js" defer></script><script src="/update-runtime.js" defer></script><script src="/shell.js" defer></script></head>
<body><main id="page-host"><p class="startup-status" role="status">正在打开本地工作空间…</p></main>
<button id="client-settings-open" class="client-settings-toggle" type="button" aria-label="服务器地址设置" title="服务器地址设置">设置</button>
<aside id="connection-status" hidden role="status"><span></span><button id="connection-retry" type="button">重试</button></aside>
<dialog id="client-settings" aria-labelledby="settings-title"><form id="server-form"><h2 id="settings-title">客户端设置</h2><p>登录与业务数据从此服务器读取。</p><label for="server-url">HTTP / HTTPS 地址</label><input id="server-url" name="serverUrl" type="url" required autocomplete="url" placeholder="https://manager.example.com"><p id="settings-error" role="alert"></p><div class="dialog-actions"><button type="button" id="settings-cancel">关闭</button><button type="submit">保存并连接</button></div><small id="client-version"></small></form><section id="client-updates" hidden aria-labelledby="updates-title"><h2 id="updates-title">页面更新</h2><p id="update-status" role="status" aria-live="polite"></p><small id="update-version"></small><p>页面下载后将在下次启动生效。立即重载会丢失当前未保存的内容。</p><div class="dialog-actions"><button id="updates-check" type="button">检查更新</button><button id="updates-apply" type="button" hidden>立即重载</button><button id="updates-installer" type="button" hidden>下载客户端</button></div></section></dialog>
<dialog id="resource-preview" aria-labelledby="preview-title"><header><h2 id="preview-title">附件预览</h2><button type="button" id="preview-save">另存为</button><button type="button" id="preview-close">关闭</button></header><div id="preview-content"></div></dialog>
<div id="client-notice" role="status" hidden></div></body></html>
