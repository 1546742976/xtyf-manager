<!-- 资金管理页（Bootstrap）：统计卡 + 记录/添加/图表 三页签；全部脚本在页面底部 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巡天御风 - 资金管理系统</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css'">
<style>
:root { --accent: #2563eb; --gold: #f0c060; --bg: #f2f4f8; }
* { box-sizing: border-box; }
body { background: var(--bg); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: #0f172a; color: #e2e8f0; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
.topbar .brand { font-weight: 700; font-size: 16px; letter-spacing: .5px; }
.topbar .brand span { color: #7dd3fc; font-weight: 400; }
.topbar .nav { display: flex; gap: 4px; flex: 1; }
.topbar .nav a { color: #cbd5e1; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-size: 14px; transition: background .15s; }
.topbar .nav a:hover { background: rgba(255, 255, 255, .08); }
.topbar .nav a.active { background: rgba(125, 211, 252, .18); color: #7dd3fc; }
.topbar .userbox { display: flex; align-items: center; gap: 10px; }
.topbar .userbox .who { color: #94a3b8; font-size: 13px; }
.topbar .userbox a.toplink { color: #fff; border: 1px solid rgba(255, 255, 255, .45); border-radius: 8px; padding: 4px 10px; font-size: 13px; text-decoration: none; }
.topbar .userbox a.toplink:hover { background: rgba(255, 255, 255, .12); }
.page-head { background: #fff; border-bottom: 1px solid #e3e7ee; padding: 12px 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-size: 18px; font-weight: 700; margin: 0; }
.nav-badge { background: #ef4444; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; margin-left: 6px; display: inline-block; line-height: 1.7; vertical-align: middle; }
.badge-pending { background: #fff1f0; color: #d93025; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.badge-ok { background: #e6f7e6; color: #52c41a; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px; }
.card-header { background: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; padding: 12px 18px; border-radius: 12px 12px 0 0 !important; }
.stat-card { text-align: center; padding: 18px 10px; }
.stat-card .value { font-size: 24px; font-weight: 700; }
.stat-card .label { color: #8c8c8c; font-size: 12px; margin-top: 2px; }
.income .value { color: #52c41a; } .expense .value { color: #ff4d4f; }
.balance .value { color: #1890ff; } .count .value { color: #722ed1; }
.badge-in { background: #e6f7e6; color: #52c41a; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.badge-out { background: #fff1f0; color: #ff4d4f; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.filter-bar { background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 16px; }
.nav-tabs .nav-link { color: #666; border: none; padding: 8px 16px; font-weight: 500; font-size: 14px; }
.nav-tabs .nav-link.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: transparent; }
.table th { font-weight: 600; font-size: 12px; color: #666; background: #fafafa; white-space: nowrap; }
.table td { font-size: 13px; vertical-align: middle; }
.btn-primary { background: var(--accent); border-color: var(--accent); }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
.btn-sm { font-size: 12px; }
.empty-state { text-align: center; padding: 50px 20px; color: #bbb; }
.empty-state i { font-size: 42px; display: block; margin-bottom: 10px; }
.modal-header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; }
.form-label { font-weight: 500; font-size: 12px; margin-bottom: 3px; }
.required:after { content: ' *'; color: #ff4d4f; }
.btn-group-sm .btn.active { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
#chartImage { max-width: 100%; border-radius: 8px; }
#summaryContent table { font-size: 12px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">巡天御风<span>管理系统</span></div>
  <nav class="nav">
    <a href="/">看板</a>
    <a href="/funds/" class="active">资金管理{% if me.username == 'chy' %}<span id="fundsPendingBadge" class="nav-badge" style="display:none">0</span>{% endif %}</a>
    <a href="/invoices/">发票管理</a>
  </nav>
  <div class="userbox">
    <span class="who">{{ me.name }}</span>
    <a class="toplink" href="/logout">退出</a>
  </div>
</header>
<div class="page-head"><h1>资金管理</h1></div>

<div class="container-fluid px-3 py-3">
  <div class="row mb-3">
    <div class="col-md-3 col-6 mb-2"><div class="card stat-card income"><div class="value" id="sIn">--</div><div class="label">总进账</div></div></div>
    <div class="col-md-3 col-6 mb-2"><div class="card stat-card expense"><div class="value" id="sOut">--</div><div class="label">总支出</div></div></div>
    <div class="col-md-3 col-6 mb-2"><div class="card stat-card balance"><div class="value" id="sBal">--</div><div class="label">结余</div></div></div>
    <div class="col-md-3 col-6 mb-2"><div class="card stat-card count"><div class="value" id="sCnt">--</div><div class="label">总记录</div></div></div>
  </div>

  <!-- 三个页签：记录管理 / 添加记录 / 统计图表 -->
<ul class="nav nav-tabs mb-3" id="mainTab">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t-records">记录管理</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-add">添加记录</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t-charts">统计图表</button></li>
  </ul>

  <div class="tab-content">
    <div class="tab-pane fade show active" id="t-records">
      <div class="filter-bar">
        <div class="row g-2 align-items-end">
          <div class="col-lg-2 col-md-4 col-6">
            <label class="form-label">类型</label>
            <select class="form-select form-select-sm" id="ft"><option value="">全部</option><option value="进">进账</option><option value="出">支出</option></select></div>
          <div class="col-lg-2 col-md-4 col-6">
            <label class="form-label">关键字</label>
            <input class="form-control form-control-sm" id="fkw" placeholder="来源/去向/人员..."></div>
          <div class="col-lg-1 col-md-3 col-6">
            <label class="form-label">金额≥</label><input type="number" class="form-control form-control-sm" id="famin" placeholder="0" step="0.01"></div>
          <div class="col-lg-1 col-md-3 col-6">
            <label class="form-label">金额≤</label><input type="number" class="form-control form-control-sm" id="famax" placeholder="999999" step="0.01"></div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label">起始</label><input type="date" class="form-control form-control-sm" id="fdf"></div>
          <div class="col-lg-2 col-md-3 col-6">
            <label class="form-label">截止</label><input type="date" class="form-control form-control-sm" id="fdt"></div>
          <div class="col-lg-2 col-md-6 col-12 d-flex gap-1">
            <button class="btn btn-primary btn-sm flex-fill" onclick="reload()">筛选</button>
            <button class="btn btn-outline-secondary btn-sm flex-fill" onclick="resetF()">重置</button>
            <button class="btn btn-outline-success btn-sm" onclick="doExport()" title="导出CSV">导出</button></div>
        </div>
      </div>
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>资金记录</span><span class="text-muted small" id="rcnt">加载中...</span></div>
        <div class="card-body p-0" style="overflow-x:auto;">
          <table class="table table-hover mb-0"><thead><tr>
            <th>#</th><th>类型</th><th style="cursor:pointer" onclick="setSort('amount')">金额</th>
            <th>类别</th><th>来源/去向</th><th>申请人</th><th>发票</th><th>处理人</th>
            <th style="cursor:pointer" onclick="setSort('record_date')">日期</th><th>审核</th><th>备注</th><th>操作</th>
          </tr></thead><tbody id="tbody"></tbody></table>
          <div class="empty-state" id="empty"><i class="bi bi-inbox" style="font-size:42px;"></i><p>暂无记录，请添加数据</p></div>
        </div>
      </div>
    </div>

    <div class="tab-pane fade" id="t-add">
      <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card"><div class="card-header">新增资金记录</div>
          <div class="card-body">
            <form id="addF" onsubmit="handleAdd(event); return false;">
              <div class="row mb-2">
                <div class="col-md-4"><label class="form-label required">类型</label>
                  <select class="form-select" id="aT" required onchange="toggleF()"><option value="">请选择</option><option value="进">进账</option><option value="出">支出</option></select></div>
                <div class="col-md-4"><label class="form-label required">金额（元）</label>
                  <input type="number" step="0.01" min="0.01" class="form-control" id="aAmt" required placeholder="0.00"></div>
                <div class="col-md-4"><label class="form-label">类别</label>
                  <select class="form-select" id="aCat">
                    <option value="">未分类</option>
                    <optgroup label="-- 支出类 --"><option value="材料费">材料费</option><option value="设备费">设备费</option><option value="加工费">加工费</option><option value="差旅费">差旅费</option><option value="办公费">办公费</option><option value="宣传费">宣传费</option><option value="餐饮费">餐饮费</option></optgroup>
                    <optgroup label="-- 进账类 --"><option value="赞助">赞助</option><option value="拨款">拨款</option><option value="奖金">奖金</option><option value="队费">队费</option></optgroup>
                    <option value="其他">其他</option></select></div>
              </div>
              <div class="row mb-2">
                <div class="col-md-6"><label class="form-label" id="lSD">来源 / 去向</label>
                  <input class="form-control" id="aSD" placeholder="例如：学校拨款"></div>
                <div class="col-md-6"><label class="form-label required">日期</label>
                  <input type="date" class="form-control" id="aDt" required></div>
              </div>
              <div id="expF" style="display:none;">
                <div class="row mb-2">
                  <div class="col-md-4"><label class="form-label required" id="lApl">申请人</label><input class="form-control" id="aApplicant" placeholder="经手采购人"></div>
                  <div class="col-md-4"><label class="form-label required" id="lInv">发票数目</label><input type="number" min="1" class="form-control" id="aInvCnt" value="1"></div>
                  <div class="col-md-4"><label class="form-label required" id="lHdl">处理人</label><input class="form-control" id="aHandler" placeholder="审核/报销处理人"></div>
                </div>
              </div>
              <div class="mb-2"><label class="form-label">备注</label>
                <textarea class="form-control" id="aNotes" rows="2" placeholder="补充说明..."></textarea></div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4">提交</button>
                <button type="reset" class="btn btn-outline-secondary" onclick="clearF()">清空</button></div>
            </form>
          </div>
        </div>
      </div></div>
    </div>

    <div class="tab-pane fade" id="t-charts">
      <div class="row mb-2"><div class="col-12">
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary active" onclick="loadChart('monthly',this)">月度收支</button>
          <button class="btn btn-outline-secondary" onclick="loadChart('category',this)">支出类别</button>
          <button class="btn btn-outline-secondary" onclick="loadChart('applicant',this)">队员支出排名</button>
          <button class="btn btn-outline-secondary" onclick="loadChart('source',this)">进账来源分布</button>
        </div>
      </div></div>
      <div class="row">
        <div class="col-lg-8"><div class="card"><div class="card-header">统计图</div>
          <div class="card-body text-center">
            <img id="chartImg" src="" style="display:none;max-width:100%;">
            <div id="chartEmp" class="empty-state"><i class="bi bi-bar-chart" style="font-size:42px;"></i><p>点击上方按钮加载图表</p></div>
          </div></div></div>
        <div class="col-lg-4"><div class="card"><div class="card-header">统计摘要</div>
          <div class="card-body" id="sumC" style="max-height:350px;overflow-y:auto;"><p class="text-muted text-center">加载中...</p></div>
        </div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editMd">
  <div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">编辑记录</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <form><input type="hidden" id="eId">
        <div class="row mb-2">
          <div class="col-md-4"><label class="form-label">类型</label><select class="form-select form-select-sm" id="eT"><option value="进">进账</option><option value="出">支出</option></select></div>
          <div class="col-md-4"><label class="form-label">金额</label><input type="number" step="0.01" class="form-control form-control-sm" id="eAmt"></div>
          <div class="col-md-4"><label class="form-label">类别</label><select class="form-select form-select-sm" id="eCat"><option value="">未分类</option><option>材料费</option><option>设备费</option><option>加工费</option><option>差旅费</option><option>办公费</option><option>宣传费</option><option>餐饮费</option><option>赞助</option><option>拨款</option><option>奖金</option><option>队费</option><option>其他</option></select></div>
        </div>
        <div class="row mb-2">
          <div class="col-md-6"><label class="form-label">来源/去向</label><input class="form-control form-control-sm" id="eSD"></div>
          <div class="col-md-3"><label class="form-label">日期</label><input type="date" class="form-control form-control-sm" id="eDt"></div>
          <div class="col-md-3"><label class="form-label">发票数</label><input type="number" min="0" class="form-control form-control-sm" id="eInv"></div>
        </div>
        <div class="row mb-2">
          <div class="col-md-6"><label class="form-label">申请人</label><input class="form-control form-control-sm" id="eApl"></div>
          <div class="col-md-6"><label class="form-label">处理人</label><input class="form-control form-control-sm" id="eHdl"></div>
        </div>
        <div class="mb-2"><label class="form-label">备注</label><textarea class="form-control form-control-sm" id="eNts" rows="2"></textarea></div>
      </form>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button><button class="btn btn-primary btn-sm" onclick="saveE()">保存</button></div>
  </div></div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js"
        onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js'"></script>

<!-- ==================== 前端逻辑 ==================== -->
<script>
var API = '/funds/api/records', sort = {by:'record_date',order:'DESC'}, edM, ct=null;
var ME_NAME = {{ me.name | tojson }}, ME_USERNAME = {{ me.username | tojson }};

document.addEventListener('DOMContentLoaded', function(){
  edM = new bootstrap.Modal('#editMd');
  document.getElementById('aDt').value = new Date().toISOString().slice(0,10);
  document.getElementById('aApplicant').value = ME_NAME;
  if (ME_USERNAME === 'chy') { loadPending(); setInterval(loadPending, 30000); }
  reload(); loadStats();
  document.getElementById('mainTab').addEventListener('shown.bs.tab', function(e){
    if (e.target.dataset.bsTarget === '#t-charts' && !ct) {
      loadChart('monthly', document.querySelector('#t-charts .btn-group .active'));
      loadStats();
    }
  });
});

function toggleF(){
  var t = document.getElementById('aT').value, isExp = (t==='出');
  document.getElementById('expF').style.display = isExp?'block':'none';
  document.getElementById('lSD').textContent = isExp?'去向':(t==='进'?'来源':'来源 / 去向');
  document.getElementById('aSD').placeholder = isExp?'例如：淘宝采购电机':(t==='进'?'例如：学校拨款':'');
  document.getElementById('lSD').className = isExp?'form-label required':'form-label';
  document.getElementById('aSD').required = isExp;
  document.getElementById('aApplicant').required = isExp;
  document.getElementById('aInvCnt').required = isExp;
  document.getElementById('aHandler').required = isExp;
  if(isExp) document.getElementById('aInvCnt').value = document.getElementById('aInvCnt').value || 1;
}
function clearF(){
  document.getElementById('addF').reset();
  document.getElementById('aDt').value = new Date().toISOString().slice(0,10);
  document.getElementById('expF').style.display = 'none';
  document.getElementById('lSD').textContent='来源 / 去向';
  document.getElementById('lSD').className = 'form-label';
  document.getElementById('aSD').required = false;
  document.getElementById('aApplicant').required = false;
  document.getElementById('aInvCnt').required = false;
  document.getElementById('aHandler').required = false;
  document.getElementById('aInvCnt').value = '1';
  document.getElementById('aApplicant').value = ME_NAME;
}
function resetF(){ document.querySelectorAll('#ft,#fkw,#famin,#famax,#fdf,#fdt').forEach(function(e){e.value=''}); reload(); }
function setSort(f){ sort.order=(sort.by===f?(sort.order==='ASC'?'DESC':'ASC'):'DESC'); sort.by=f; reload(); }

function reload(){
  var p = new URLSearchParams();
  [{id:'ft',key:'record_type'},{id:'fkw',key:'keyword'},{id:'famin',key:'amount_min'},{id:'famax',key:'amount_max'},{id:'fdf',key:'date_from'},{id:'fdt',key:'date_to'}].forEach(function(x){
    var v = document.getElementById(x.id).value.trim(); if(v) p.append(x.key,v);
  });
  p.append('sort_by',sort.by); p.append('sort_order',sort.order);
  fetch(API+'?'+p).then(function(r){return r.json()}).then(function(j){
    var rows = j.data||[];
    document.getElementById('rcnt').textContent = rows.length + ' records';
    document.getElementById('empty').style.display = rows.length?'none':'block';
    document.getElementById('tbody').innerHTML = rows.length ? rows.map(function(r){
      return '<tr>'+
        '<td>'+r.id+'</td>'+
        '<td><span class="'+(r.record_type==='进'?'badge-in':'badge-out')+'">'+(r.record_type==='进'?'进账':'支出')+'</span></td>'+
        '<td>¥'+r.amount.toFixed(2)+'</td>'+
        '<td>'+(r.category||'-')+'</td>'+
        '<td title="'+(r.source_dest||'')+'">'+(r.source_dest||'-')+'</td>'+
        '<td>'+(r.applicant||'-')+'</td>'+
        '<td>'+(r.invoice_count||0)+'</td>'+
        '<td>'+(r.handler||'-')+'</td>'+
        '<td>'+r.record_date+'</td>'+
        '<td>'+((r.review_status==='待审核')?'<span class="badge-pending">待审核</span> <button class="btn btn-outline-primary btn-sm" onclick="reviewRecord('+r.id+')">通过</button>':'<span class="badge-ok">已审核</span>')+'</td>'+
        '<td style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+(r.notes||'').replace(/"/g,'&quot;')+'">'+(r.notes||'-')+'</td>'+
        '<td><button class="btn btn-outline-secondary btn-sm" onclick="edR('+r.id+')"><i class="bi bi-pencil"></i></button> <button class="btn btn-outline-danger btn-sm" onclick="delR('+r.id+')"><i class="bi bi-trash"></i></button></td>'+
        '</tr>';
    }).join('') : '';
  }).catch(function(e){ alert('Load failed: '+e.message); });
}

async function handleAdd(e){
  e.preventDefault();
  var d = {
    record_type: document.getElementById('aT').value,
    amount: parseFloat(document.getElementById('aAmt').value),
    category: document.getElementById('aCat').value,
    source_dest: document.getElementById('aSD').value.trim(),
    record_date: document.getElementById('aDt').value,
    notes: document.getElementById('aNotes').value.trim()
  };
  d.applicant = document.getElementById('aApplicant').value.trim() || ME_NAME;
  if(d.record_type==='出'){
    d.invoice_count = parseInt(document.getElementById('aInvCnt').value)||0;
    d.handler = document.getElementById('aHandler').value.trim();
  }
  try {
    var r = await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    var j = await r.json();
    if(j.code===0){ alert(j.review_status==='待审核' ? '已添加，等待陈虹宇审核' : '已添加'); clearF(); reload(); loadStats(); if(ME_USERNAME==='chy')loadPending(); }
    else alert(j.msg);
  } catch(e){ alert('Submit failed: '+e.message); }
}

async function edR(id){
  try {
    var r = await fetch(API+'?sort_by=id&sort_order=DESC'), j = await r.json();
    var d = j.data.find(function(x){return x.id===id});
    if(!d) return alert('Not found');
    document.getElementById('eId').value=d.id; document.getElementById('eT').value=d.record_type;
    document.getElementById('eAmt').value=d.amount; document.getElementById('eCat').value=d.category||'';
    document.getElementById('eSD').value=d.source_dest||''; document.getElementById('eDt').value=d.record_date;
    document.getElementById('eInv').value=d.invoice_count||0; document.getElementById('eApl').value=d.applicant||'';
    document.getElementById('eHdl').value=d.handler||''; document.getElementById('eNts').value=d.notes||'';
    edM.show();
  } catch(e){ alert('Load failed'); }
}

async function saveE(){
  var d = {
    record_type: document.getElementById('eT').value,
    amount: parseFloat(document.getElementById('eAmt').value),
    category: document.getElementById('eCat').value,
    source_dest: document.getElementById('eSD').value.trim(),
    record_date: document.getElementById('eDt').value,
    invoice_count: parseInt(document.getElementById('eInv').value)||0,
    applicant: document.getElementById('eApl').value.trim(),
    handler: document.getElementById('eHdl').value.trim(),
    notes: document.getElementById('eNts').value.trim()
  };
  try {
    var r = await fetch(API+'/'+document.getElementById('eId').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
    var j = await r.json();
    if(j.code===0){ edM.hide(); reload(); loadStats(); }
    else alert(j.msg);
  } catch(e){ alert('Save failed'); }
}

async function delR(id){
  if(!confirm('Delete this record?')) return;
  try { await fetch(API+'/'+id,{method:'DELETE'}); reload(); loadStats(); } catch(e){ alert('Delete failed'); }
}

async function reviewRecord(id){
  if(!confirm('确认审核通过该记录？')) return;
  try{
    var r = await fetch(API+'/'+id+'/review',{method:'POST'});
    var j = await r.json();
    if(j.code===0){ alert('已审核通过'); reload(); loadStats(); if(ME_USERNAME==='chy')loadPending(); }
    else alert(j.msg||'操作失败');
  }catch(e){ alert('操作失败'); }
}

async function loadPending(){
  try{
    var r = await fetch('/funds/api/pending_review');
    var j = await r.json();
    var badge = document.getElementById('fundsPendingBadge');
    if(badge && j.code===0 && j.count>0){ badge.textContent=j.count; badge.style.display=''; }
    else if(badge){ badge.style.display='none'; }
  }catch(e){}
}

function loadStats(){
  Promise.all([fetch('/funds/api/stats'),fetch(API+'?sort_by=id&sort_order=DESC')]).then(function(arr){
    return Promise.all([arr[0].json(),arr[1].json()]);
  }).then(function(arr){
    var d = arr[0].data, cnt = (arr[1].data||[]).length;
    document.getElementById('sIn').textContent = '¥'+d.total_in.toFixed(2);
    document.getElementById('sOut').textContent = '¥'+d.total_out.toFixed(2);
    var bal = d.balance;
    document.getElementById('sBal').textContent = (bal>=0?'¥':'¥-')+Math.abs(bal).toFixed(2);
    document.getElementById('sBal').style.color = bal>=0?'#1890ff':'#ff4d4f';
    document.getElementById('sCnt').textContent = cnt;

    var h = '<table class="table table-sm small mb-0">';
    h += '<tr class="table-success"><td colspan="2"><b>Income Sources TOP5</b></td></tr>';
    d.source_stats.slice(0,5).forEach(function(s){ h += '<tr><td>'+s.source+'</td><td style="text-align:right">¥'+s.total.toFixed(2)+' ('+s.cnt+')</td></tr>'; });
    if(!d.source_stats.length) h += '<tr><td colspan="2" class="text-muted">No data</td></tr>';
    h += '<tr class="table-danger"><td colspan="2"><b>Member Expenses TOP5</b></td></tr>';
    d.applicant_stats.slice(0,5).forEach(function(s){ h += '<tr><td>'+s.applicant+'</td><td style="text-align:right">¥'+s.total.toFixed(2)+' ('+s.cnt+')</td></tr>'; });
    if(!d.applicant_stats.length) h += '<tr><td colspan="2" class="text-muted">No data</td></tr>';
    h += '<tr><td colspan="2"><b>Category Expenses TOP5</b></td></tr>';
    d.category_stats.slice(0,5).forEach(function(s){ h += '<tr><td>'+(s.category||'Other')+'</td><td style="text-align:right">¥'+s.total.toFixed(2)+'</td></tr>'; });
    if(!d.category_stats.length) h += '<tr><td colspan="2" class="text-muted">No data</td></tr>';
    h += '</table>';
    document.getElementById('sumC').innerHTML = h;
  }).catch(function(e){ console.error(e); });
}

function loadChart(type, btn){
  ct = type;
  document.querySelectorAll('#t-charts .btn-group .btn').forEach(function(b){ b.classList.remove('active'); });
  if(btn) btn.classList.add('active');
  fetch('/funds/api/chart?type='+type).then(function(r){return r.json()}).then(function(j){
    if(j.code===0){
      document.getElementById('chartImg').src = j.data;
      document.getElementById('chartImg').style.display = 'inline';
      document.getElementById('chartEmp').style.display = 'none';
    } else {
      document.getElementById('chartEmp').innerHTML = '<p>No data or generation failed</p>';
      document.getElementById('chartEmp').style.display = 'block';
      document.getElementById('chartImg').style.display = 'none';
    }
  }).catch(function(e){ console.error(e); });
}

function doExport(){
  var u = '/funds/api/export?';
  var t = document.getElementById('ft').value, k = document.getElementById('fkw').value.trim();
  if(t) u += 'record_type='+t+'&';
  if(k) u += 'keyword='+encodeURIComponent(k);
  window.location.href = u;
}
</script>
